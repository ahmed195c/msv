name: Build desktop app (Windows)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install desktop dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements-desktop.txt

      - name: Stage the Django project as plain source (not frozen by PyInstaller)
        run: |
          mkdir -p staging/django_src
          cp -r msv/msv staging/django_src/msv
          cp -r msv/hcsd staging/django_src/hcsd
          find staging/django_src -name '__pycache__' -type d -exec rm -rf {} + || true

      - name: Collect static files into the staged copy
        env:
          DJANGO_SETTINGS_MODULE: msv.settings
          PYTHONPATH: staging/django_src
        run: python -m django collectstatic --noinput

      - name: Build with PyInstaller
        working-directory: desktop
        run: pyinstaller msv_desktop.spec --noconfirm --clean

      - name: Build the update-applier tool
        working-directory: desktop
        run: pyinstaller apply_update.spec --noconfirm --clean

      - name: Verify the update-applier tool actually built
        run: |
          f="desktop/dist/apply-update.exe"
          if [ ! -f "$f" ] || [ "$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")" -lt 100000 ]; then
            echo "::error::apply-update.exe is missing or suspiciously small — PyInstaller likely failed silently."
            exit 1
          fi
          echo "apply-update.exe built ($(stat -c%s "$f" 2>/dev/null || stat -f%z "$f") bytes)."

      - name: Smoke-test the frozen exe actually boots Django
        run: |
          cp -r staging/django_src desktop/dist/app/django_src
          cd desktop/dist/app
          # Runs the real frozen exe. It prints MSV_DESKTOP_SERVER_READY
          # once Django/migrate/waitress have actually succeeded, right
          # before it touches webview — whatever happens with webview
          # after that (e.g. no interactive desktop session on this
          # runner) doesn't matter to this check, only reaching that point
          # does. If the marker never appears, this is a real startup
          # failure (missing bundled module, migration error, etc).
          timeout 25 ./msv-desktop-debug.exe > boot.log 2>&1 || true
          cat boot.log
          if ! grep -q "MSV_DESKTOP_SERVER_READY" boot.log; then
            echo "::error::Frozen exe never reached a successful startup — see log above."
            exit 1
          fi
          echo "Frozen exe booted Django successfully."
          rm -rf data django_src boot.log

      - name: Assemble the portable app/ folder
        run: |
          mv staging/django_src desktop/dist/app/django_src
          mkdir -p "MSV-Desktop/app"
          cp -r desktop/dist/app/* "MSV-Desktop/app/"
          cp desktop/dist/apply-update.exe "MSV-Desktop/apply-update.exe"
          cp desktop/README.md "MSV-Desktop/README.md"

      - name: Zip the build
        run: powershell -Command "Compress-Archive -Path 'MSV-Desktop' -DestinationPath 'MSV-Desktop-windows.zip'"

      - uses: actions/upload-artifact@v4
        with:
          name: MSV-Desktop-windows
          path: MSV-Desktop-windows.zip
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MSV-Desktop-windows.zip
