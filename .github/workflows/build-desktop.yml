name: Build desktop app (Windows + Linux)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install desktop dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements-desktop.txt

      - name: Stage the Django project as plain source (not frozen by PyInstaller)
        run: |
          mkdir -p staging/django_src
          cp -r msv/msv staging/django_src/msv
          cp -r msv/hcsd staging/django_src/hcsd
          find staging/django_src -name '__pycache__' -type d -exec rm -rf {} + || true

      - name: Collect static files into the staged copy
        env:
          DJANGO_SETTINGS_MODULE: msv.settings
          PYTHONPATH: staging/django_src
        run: python -m django collectstatic --noinput

      - name: Build with PyInstaller
        working-directory: desktop
        run: pyinstaller msv_desktop.spec --noconfirm --clean

      - name: Build the update-applier tool
        working-directory: desktop
        run: pyinstaller apply_update.spec --noconfirm --clean

      - name: Verify the update-applier tool actually built
        run: |
          f="desktop/dist/apply-update.exe"
          if [ ! -f "$f" ] || [ "$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")" -lt 100000 ]; then
            echo "::error::apply-update.exe is missing or suspiciously small — PyInstaller likely failed silently."
            exit 1
          fi
          echo "apply-update.exe built ($(stat -c%s "$f" 2>/dev/null || stat -f%z "$f") bytes)."

      - name: Smoke-test the frozen exe actually boots Django
        run: |
          cp -r staging/django_src desktop/dist/app/django_src
          cd desktop/dist/app
          # Runs the real frozen exe. It prints MSV_DESKTOP_SERVER_READY
          # once Django/migrate/waitress have actually succeeded, right
          # before it touches webview — whatever happens with webview
          # after that (e.g. no interactive desktop session on this
          # runner) doesn't matter to this check, only reaching that point
          # does. If the marker never appears, this is a real startup
          # failure (missing bundled module, migration error, etc).
          timeout 25 ./msv-desktop-debug.exe > boot.log 2>&1 || true
          cat boot.log
          if ! grep -q "MSV_DESKTOP_SERVER_READY" boot.log; then
            echo "::error::Frozen exe never reached a successful startup — see log above."
            exit 1
          fi
          echo "Frozen exe booted Django successfully."
          rm -rf data django_src boot.log

      - name: Assemble the portable app/ folder
        run: |
          mv staging/django_src desktop/dist/app/django_src
          mkdir -p "MSV-Desktop/app"
          cp -r desktop/dist/app/* "MSV-Desktop/app/"
          cp desktop/dist/apply-update.exe "MSV-Desktop/apply-update.exe"
          cp desktop/README.md "MSV-Desktop/README.md"

      - name: Zip the build
        run: powershell -Command "Compress-Archive -Path 'MSV-Desktop' -DestinationPath 'MSV-Desktop-windows.zip'"

      - uses: actions/upload-artifact@v4
        with:
          name: MSV-Desktop-windows
          path: MSV-Desktop-windows.zip
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MSV-Desktop-windows.zip

  build-linux:
    # Oldest supported runner: the bundle then runs on any newer distro (glibc).
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Qt's X11 plugin needs these; installed here so PyInstaller bundles
      # them and the target PC doesn't have to have them.
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libxcb-xinerama0 libegl1 python3-tk

      - name: Install desktop dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements-desktop.txt

      - name: Stage the Django project as plain source (not frozen by PyInstaller)
        run: |
          mkdir -p staging/django_src
          cp -r msv/msv staging/django_src/msv
          cp -r msv/hcsd staging/django_src/hcsd
          find staging/django_src -name '__pycache__' -type d -exec rm -rf {} + || true

      - name: Collect static files into the staged copy
        env:
          DJANGO_SETTINGS_MODULE: msv.settings
          PYTHONPATH: staging/django_src
        run: python -m django collectstatic --noinput

      - name: Build with PyInstaller
        working-directory: desktop
        run: |
          pyinstaller msv_desktop.spec --noconfirm --clean
          pyinstaller apply_update.spec --noconfirm --clean

      - name: Smoke-test the frozen app actually boots Django
        run: |
          cp -r staging/django_src desktop/dist/app/django_src
          cd desktop/dist/app
          # No display here: the marker is printed before any window opens.
          timeout 40 ./msv-desktop-debug > boot.log 2>&1 || true
          cat boot.log
          if ! grep -q "MSV_DESKTOP_SERVER_READY" boot.log; then
            echo "::error::Frozen app never reached a successful startup — see log above."
            exit 1
          fi
          rm -rf ../data django_src boot.log

      - name: Assemble the portable folder
        run: |
          mv staging/django_src desktop/dist/app/django_src
          python -c "from PIL import Image; Image.open('desktop/app.ico').save('desktop/dist/app/msv-desktop.png')"
          mkdir -p MSV-Desktop/app
          cp -r desktop/dist/app/* MSV-Desktop/app/
          cp desktop/dist/apply-update MSV-Desktop/apply-update
          cp desktop/linux/install-shortcut.sh MSV-Desktop/install-shortcut.sh
          cp desktop/README.md MSV-Desktop/README.md
          chmod +x MSV-Desktop/apply-update MSV-Desktop/install-shortcut.sh MSV-Desktop/app/msv-desktop MSV-Desktop/app/msv-desktop-debug

      # tar keeps the run permission on the launchers; a zip would drop it.
      - name: Pack the build
        run: tar -czf MSV-Desktop-linux.tar.gz MSV-Desktop

      - uses: actions/upload-artifact@v4
        with:
          name: MSV-Desktop-linux
          path: MSV-Desktop-linux.tar.gz
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MSV-Desktop-linux.tar.gz
