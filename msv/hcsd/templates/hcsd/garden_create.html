{% extends "hcsd/garden_base.html" %}
{% block title %}إضافة موقع جديد{% endblock %}
{% block content %}
<style>
.gv-form-page { max-width: 560px; margin: 0 auto; }
.gv-form-page h1 { font-size: 19px; font-weight: 700; color: var(--ink); margin: 0 0 20px; }

.gv-alert {
  background: #fef2f2; border: 1.5px solid #fca5a5; color: #991b1b;
  border-radius: 8px; padding: 10px 14px; font-size: 13px; font-weight: 600;
  margin-bottom: 16px;
}

.field-wrap { display: grid; gap: 6px; margin-bottom: 14px; }
.field-wrap label { font-size: 12.5px; font-weight: 700; color: var(--ink-2); }
.field-wrap input, .field-wrap textarea {
  border: 1.5px solid var(--line); border-radius: 8px; background: #fff;
  padding: 9px 12px; font-size: 14px; font-family: inherit; color: var(--ink);
  box-sizing: border-box; width: 100%;
}
.field-wrap input:focus, .field-wrap textarea:focus { outline: none; border-color: var(--accent); }
.three-col { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.three-col > .field-wrap { min-width: 0; }
@media (max-width: 480px) { .three-col { grid-template-columns: 1fr; } }

.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 9px 20px; border-radius: 8px; font-size: 13.5px; font-weight: 700;
  text-decoration: none; cursor: pointer; border: 1.5px solid var(--line);
  background: var(--paper); color: var(--ink-2); font-family: inherit;
}
.btn-outline:hover { background: var(--surface); }
.btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-primary:hover { background: var(--accent-dk); border-color: var(--accent-dk); }

.gv-gps-status { font-size: 12.5px; font-weight: 600; }

/* Modern pill stepper for the infestation-count fields */
.stepper {
  display: flex; align-items: stretch; height: 44px; min-width: 0;
  border-radius: 999px; overflow: hidden; border: 1.5px solid var(--line);
  direction: ltr;
}
.stepper__btn {
  width: 44px; flex-shrink: 0; border: none; font-size: 20px; font-weight: 700;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: filter .15s; line-height: 1;
}
.stepper__btn:first-child { background: var(--accent-bg); color: var(--accent-dk); }
.stepper__btn:last-child  { background: var(--accent); color: #fff; }
.stepper__btn:hover { filter: brightness(0.95); }
.stepper__btn:active { transform: scale(0.96); }
.stepper__val {
  flex: 1; border: none !important; background: #fff !important; text-align: center;
  font-size: 18px; font-weight: 800; color: var(--ink); min-width: 0;
  padding: 0 !important;
}
.stepper__val::-webkit-outer-spin-button, .stepper__val::-webkit-inner-spin-button {
  -webkit-appearance: none; margin: 0;
}
.stepper__val { -moz-appearance: textfield; }

.checkbox-group { display: flex; flex-direction: column; gap: 8px; }
.checkbox-option {
  display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--ink);
  border: 1.5px solid var(--line); border-radius: 8px; padding: 9px 12px; cursor: pointer;
  transition: border-color .15s, background .15s;
}
.checkbox-option:hover { background: var(--surface); }
.checkbox-option input { width: 16px; height: 16px; accent-color: var(--accent); flex-shrink: 0; }

.gv-spots { display: grid; gap: 12px; margin-bottom: 10px; }
.gv-spot { border: 1.5px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 10px; background: var(--surface); }
.gv-spot__head { display: flex; align-items: center; justify-content: space-between; }
.gv-spot__title { font-size: 13px; font-weight: 700; color: var(--ink); }
.gv-spot__remove {
  font-size: 11.5px; font-weight: 700; color: #b03a1a; background: none;
  border: none; cursor: pointer; padding: 2px 6px;
}
.gv-upload-zone {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 4px; padding: 16px; border: 1.5px dashed var(--line-2); border-radius: 8px;
  background: #fff; cursor: pointer; text-align: center;
}
.gv-upload-zone:hover { background: var(--surface-2); }
.gv-upload-zone span { font-size: 12px; color: var(--ink-3); }
.gv-spot__photo-count { font-size: 11.5px; color: var(--accent-dk); font-weight: 600; }
.gv-add-spot-btn { width: fit-content; }
</style>

<div class="gv-form-page">
  <h1>إضافة موقع جديد</h1>

  {% if errors %}
    {% for e in errors %}<div class="gv-alert">{{ e }}</div>{% endfor %}
  {% endif %}

  <form method="post" id="gv-form" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="field-wrap">
      <label>اسم المنطقة *</label>
      <input type="text" name="area_name" value="{{ post.area_name }}" required>
    </div>

    <div class="field-wrap">
      <label>تفاصيل الموقع (لتمييزه عن مواقع بنفس اسم المنطقة)</label>
      <input type="text" name="location_details" value="{{ post.location_details }}" placeholder="مثال: بجانب مسجد كذا، رقم المبنى 12">
    </div>

    <div class="field-wrap">
      <label>الموقع الحالي</label>
      <input type="hidden" name="latitude" id="gv-lat-inp" value="{{ post.latitude }}">
      <input type="hidden" name="longitude" id="gv-lng-inp" value="{{ post.longitude }}">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <button type="button" id="gv-gps-btn" class="btn btn-outline" onclick="gvCaptureLocation()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          تحديد موقعي الحالي عبر GPS
        </button>
        <span id="gv-gps-status" class="gv-gps-status"></span>
      </div>
    </div>

    <div class="field-wrap">
      <label>رابط خرائط قوقل (اختياري)</label>
      <input type="url" name="google_maps_url" value="{{ post.google_maps_url }}" placeholder="https://maps.app.goo.gl/…">
    </div>

    <div class="three-col">
      <div class="field-wrap">
        <label>مناهيل مصابة</label>
        <div class="stepper">
          <button type="button" class="stepper__btn" onclick="gvStep('infested_manholes', -1)">−</button>
          <input type="number" inputmode="numeric" name="infested_manholes" id="gv-num-infested_manholes" class="stepper__val" min="0" value="{{ post.infested_manholes|default:'0' }}">
          <button type="button" class="stepper__btn" onclick="gvStep('infested_manholes', 1)">+</button>
        </div>
      </div>
      <div class="field-wrap">
        <label>إصابة خارجية</label>
        <div class="stepper">
          <button type="button" class="stepper__btn" onclick="gvStep('infested_outside', -1)">−</button>
          <input type="number" inputmode="numeric" name="infested_outside" id="gv-num-infested_outside" class="stepper__val" min="0" value="{{ post.infested_outside|default:'0' }}">
          <button type="button" class="stepper__btn" onclick="gvStep('infested_outside', 1)">+</button>
        </div>
      </div>
      <div class="field-wrap">
        <label>إجمالي مباني مصابة</label>
        <div class="stepper">
          <button type="button" class="stepper__btn" onclick="gvStep('total_infested_bldg', -1)">−</button>
          <input type="number" inputmode="numeric" name="total_infested_bldg" id="gv-num-total_infested_bldg" class="stepper__val" min="0" value="{{ post.total_infested_bldg|default:'0' }}">
          <button type="button" class="stepper__btn" onclick="gvStep('total_infested_bldg', 1)">+</button>
        </div>
      </div>
    </div>

    <div class="field-wrap">
      <label>نوع الإصابة (اختياري)</label>
      <div class="checkbox-group">
        {% for code, label in infestation_type_choices %}
        <label class="checkbox-option">
          <input type="checkbox" name="infestation_type" value="{{ code }}"
                 {% if code in selected_infestation_types %}checked{% endif %}>
          {{ label }}
        </label>
        {% endfor %}
      </div>
    </div>

    <div class="field-wrap">
      <label>أماكن الإصابة (اختياري)</label>
      <div id="gv-spots" class="gv-spots"></div>
      <button type="button" class="btn btn-outline gv-add-spot-btn" onclick="gvAddSpot()">+ إضافة مكان إصابة</button>
    </div>

    <button type="submit" class="btn btn-primary">إضافة الموقع</button>
  </form>
</div>

<script>
var gvSpotCounter = 0;

function gvAddSpot() {
  gvSpotCounter++;
  var idx = gvSpotCounter;
  var div = document.createElement('div');
  div.className = 'gv-spot';
  div.innerHTML =
    '<div class="gv-spot__head">' +
      '<span class="gv-spot__title"></span>' +
      '<button type="button" class="gv-spot__remove" onclick="gvRemoveSpot(this)">حذف</button>' +
    '</div>' +
    '<label class="gv-upload-zone">' +
      '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color:var(--ink-3);"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>' +
      '<span class="gv-spot__photo-status">اضغط لاختيار صور (متعدد)</span>' +
      '<input type="file" name="spot_photos_' + idx + '" accept="image/*" multiple style="display:none;" onchange="gvUpdatePhotoStatus(this)">' +
    '</label>' +
    '<input type="text" name="spot_description_' + idx + '" placeholder="وصف بسيط لمكان الإصابة (اختياري)">';
  document.getElementById('gv-spots').appendChild(div);
  gvRenumberSpots();
}

function gvRemoveSpot(btn) {
  btn.closest('.gv-spot').remove();
  gvRenumberSpots();
}

function gvRenumberSpots() {
  var spots = document.querySelectorAll('#gv-spots .gv-spot');
  spots.forEach(function(el, i) {
    el.querySelector('.gv-spot__title').textContent = 'مكان الإصابة ' + (i + 1);
  });
}

function gvUpdatePhotoStatus(input) {
  var status = input.closest('.gv-upload-zone').querySelector('.gv-spot__photo-status');
  var n = input.files ? input.files.length : 0;
  status.textContent = n > 0 ? ('✓ ' + n + ' صورة مختارة') : 'اضغط لاختيار صور (متعدد)';
}

function gvStep(name, delta) {
  var inp = document.getElementById('gv-num-' + name);
  if (!inp) return;
  var val = parseInt(inp.value, 10);
  if (isNaN(val)) val = 0;
  val = Math.max(0, val + delta);
  inp.value = val;
}

function gvCaptureLocation() {
  var btn    = document.getElementById('gv-gps-btn');
  var status = document.getElementById('gv-gps-status');
  var latInp = document.getElementById('gv-lat-inp');
  var lngInp = document.getElementById('gv-lng-inp');

  if (!navigator.geolocation) {
    status.textContent = 'المتصفح لا يدعم تحديد الموقع.';
    status.style.color = '#8c2f2f';
    return;
  }
  btn.disabled = true;
  status.textContent = 'جارٍ تحديد الموقع…';
  status.style.color = '#374151';

  navigator.geolocation.getCurrentPosition(
    function(pos) {
      latInp.value = pos.coords.latitude.toFixed(6);
      lngInp.value = pos.coords.longitude.toFixed(6);
      status.textContent = '✓ تم تحديد الموقع';
      status.style.color = '#116430';
      btn.disabled = false;
    },
    function(err) {
      status.style.color = '#8c2f2f';
      if (err && err.code === err.PERMISSION_DENIED) {
        status.textContent = 'تم رفض صلاحية الموقع سابقًا على هذا الجهاز، لذلك لن يظهر طلب الإذن مرة أخرى تلقائيًا. '
          + 'على الآيفون: افتح "الإعدادات" ← "الخصوصية والأمان" ← "خدمات الموقع" وتأكد أنها مفعّلة، '
          + 'ثم من نفس الصفحة افتح "Safari" واختر "أثناء استخدام التطبيق". '
          + 'أو داخل Safari اضغط على "aA" بجانب شريط العنوان ← "إعدادات الموقع لهذا الموقع" ← "اسمح"، ثم أعد المحاولة.';
      } else if (err && err.code === err.TIMEOUT) {
        status.textContent = 'انتهت المهلة قبل تحديد الموقع — تأكد من تفعيل GPS وحاول مرة أخرى في مكان مفتوح.';
      } else {
        status.textContent = 'تعذّر الحصول على الموقع — تأكد من منح صلاحية الموقع.';
      }
      btn.disabled = false;
    },
    { enableHighAccuracy: true, timeout: 12000 }
  );
}
</script>
{% endblock %}
