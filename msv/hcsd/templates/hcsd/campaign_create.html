{% extends "hcsd/campaign_base.html" %}
{% block title %}إضافة طلب جديد{% endblock %}
{% block content %}
<style>
.cp-form-page { max-width: 560px; margin: 0 auto; }
.cp-form-page h1 { font-size: 19px; font-weight: 700; color: var(--ink); margin: 0 0 20px; }

.cp-alert {
  background: #fef2f2; border: 1.5px solid #fca5a5; color: #991b1b;
  border-radius: 8px; padding: 10px 14px; font-size: 13px; font-weight: 600;
  margin-bottom: 16px;
}

.field-wrap { display: grid; gap: 6px; margin-bottom: 14px; }
.field-wrap label { font-size: 12.5px; font-weight: 700; color: var(--ink-2); }
.field-wrap input, .field-wrap textarea {
  border: 1.5px solid var(--line); border-radius: 8px; background: #fff;
  padding: 9px 12px; font-size: 14px; font-family: inherit; color: var(--ink);
  box-sizing: border-box; width: 100%;
}
.field-wrap input:focus, .field-wrap textarea:focus { outline: none; border-color: var(--accent); }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 9px 20px; border-radius: 8px; font-size: 13.5px; font-weight: 700;
  text-decoration: none; cursor: pointer; border: none; font-family: inherit;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-dk); }

@media (max-width: 480px) { .two-col { grid-template-columns: 1fr; } }
</style>

<div class="cp-form-page">
  <h1>إضافة طلب جديد</h1>

  {% if errors %}
    {% for e in errors %}<div class="cp-alert">{{ e }}</div>{% endfor %}
  {% endif %}

  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="field-wrap">
      <label>اسم الشركة *</label>
      <input type="text" name="company_name" value="{{ post.company_name }}" required>
    </div>
    <div class="two-col">
      <div class="field-wrap"><label>رقم البناية</label><input type="text" name="building_number" value="{{ post.building_number }}"></div>
      <div class="field-wrap"><label>المنطقة</label><input type="text" name="area" value="{{ post.area }}"></div>
    </div>
    <div class="field-wrap">
      <label>مكان الإصابة</label>
      <input type="text" name="infestation_location" value="{{ post.infestation_location }}" placeholder="مكان الإصابة داخل الموقع…">
    </div>
    <div class="field-wrap">
      <label>رابط الموقع على خرائط قوقل</label>
      <input type="url" name="google_maps_url" value="{{ post.google_maps_url }}" placeholder="https://maps.app.goo.gl/…">
    </div>
    <div class="field-wrap">
      <label>صورة</label>
      <input type="file" name="photo" accept="image/*">
    </div>
    <button type="submit" class="btn btn-primary">إضافة الطلب</button>
  </form>
</div>
{% endblock %}
