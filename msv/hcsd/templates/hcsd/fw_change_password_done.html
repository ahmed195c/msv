{% extends "hcsd/field_work_base.html" %}
{% block title %}تم تغيير كلمة المرور{% endblock %}
{% block content %}
<div style="max-width:480px;margin:60px auto;padding:0 16px;text-align:center;">
  <div style="background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:40px 32px;">
    <div style="width:56px;height:56px;border-radius:50%;background:#dcfce7;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <div style="font-size:18px;font-weight:700;color:var(--ink);margin-bottom:8px;">
      <span class="t-ar">تم تغيير كلمة المرور بنجاح</span><span class="t-en">Password Changed Successfully</span>
    </div>
    <div style="font-size:13px;color:var(--ink-3);margin-bottom:28px;">
      <span class="t-ar">كلمة مرورك الجديدة أصبحت فعّالة الآن</span><span class="t-en">Your new password is now active</span>
    </div>
    <a href="{% url 'field_work_list' %}" style="display:inline-flex;align-items:center;gap:6px;padding:9px 20px;border-radius:8px;background:var(--accent);color:#fff;text-decoration:none;font-size:13px;font-weight:700;">
      <span class="t-ar">العودة لأوامر العمل</span><span class="t-en">Back to Work Orders</span>
    </a>
  </div>
</div>
{% endblock %}
